name: Build

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.repository == 'openthread/ot-ifx' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  pretty:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y clang-format-14 clang-format-19 shellcheck shfmt
        python3 -m pip install yapf==0.29.0
    - name: Check
      run: |
        script/make-pretty check

  markdown-link-check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Bootstrap
      env:
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        for attempt in 1 2 3; do
          if npm install -g @umbrelladocs/linkspector@0.5.6; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep 10
        done
        wget --timeout=30 --tries=4 -O /tmp/reviewdog.tar.gz https://github.com/reviewdog/reviewdog/releases/download/v0.21.0/reviewdog_0.21.0_Linux_x86_64.tar.gz
        sudo tar -xzf /tmp/reviewdog.tar.gz -C /usr/local/bin reviewdog
        rm -f /tmp/reviewdog.tar.gz
    - name: Run linkspector
      env:
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for attempt in 1 2 3; do
          linkspector_exit=0
          linkspector check -c .linkspector.yml -j > /tmp/linkspector.rdjson || linkspector_exit=$?
          if [ "$linkspector_exit" -eq 0 ]; then
            break
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Linkspector check failed (attempt ${attempt}/3); retrying in 10s..." >&2
            sleep 10
          fi
        done
        if [ ! -s /tmp/linkspector.rdjson ]; then
          exit "${linkspector_exit:-1}"
        fi
        reviewdog -f=rdjson \
          -name=Linkspector \
          -reporter=github-check \
          -filter-mode=added \
          -fail-level=error \
          -level=error < /tmp/linkspector.rdjson

  arm-gcc:
    name: arm-gcc-${{ matrix.gcc_ver }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - gcc_ver: 9
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2020q2/gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2
            gcc_extract_dir: gcc-arm-none-eabi-9-2020-q2-update
          - gcc_ver: 10
            gcc_download_url: https://developer.arm.com/-/media/Files/downloads/gnu-rm/10-2020q4/gcc-arm-none-eabi-10-2020-q4-major-x86_64-linux.tar.bz2
            gcc_extract_dir: gcc-arm-none-eabi-10-2020-q4-major
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      env:
        GCC_DOWNLOAD_URL: ${{ matrix.gcc_download_url }}
      run: |
        cd /tmp
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y lib32z1 ninja-build
        wget --tries=4 --timeout=30 "${GCC_DOWNLOAD_URL}" -O gcc-arm.tar.bz2
        tar xjf gcc-arm.tar.bz2
        # use the minimal required cmake version
        sudo env PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install -U cmake==3.15.3
        cmake --version | grep 3.15.3
    - name: Build
      env:
        GCC_EXTRACT_DIR: ${{ matrix.gcc_extract_dir }}
      run: |
        export PATH="/tmp/${GCC_EXTRACT_DIR}/bin:${PATH}"
        script/test
